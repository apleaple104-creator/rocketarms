name: Build mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q rocketarms-forge-1.20.1-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build
        working-directory: rocketarms
      - uses: actions/upload-artifact@v4
        with:
          name: rocketarms-jar
          path: rocketarms/build/libs/*.jar
